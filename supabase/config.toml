project_id = "uheeddmtntnlgrpzfjph"

[functions.send-notification]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-notification/index.ts"

[functions.notify-feedback]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-feedback/index.ts"

# Called from the admin screen with the admin's own JWT; it checks is_admin
# itself and derives the recipient, so send-email can stay service-role only.
[functions.notify-content-removed]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-content-removed/index.ts"

# Never called from a browser — send-notification and notify-content-removed
# reach it with the service role key.
[functions.send-email]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-email/index.ts"

# Scheduled jobs. pg_cron authenticates with CRON_SECRET, an opaque random
# string rather than a JWT, so the gateway's verify_jwt has to be off — it
# answered UNAUTHORIZED_INVALID_JWT_FORMAT before the handler ever ran.
#
# These are not open as a result: requireServiceRole is the real gate and does a
# constant-time compare against CRON_SECRET or the service role key. verify_jwt
# was never providing protection here anyway, since any valid JWT satisfied it —
# including the anon key that ships in the browser bundle.
#
# Listed explicitly to keep the deployed set visible: a job that silently fails
# to deploy is a notification channel that quietly does not exist, which is
# exactly what happened to unfilled-nudge-48h.
[functions.game-reminders]
enabled = true
verify_jwt = false
entrypoint = "./functions/game-reminders/index.ts"

# Named unfilled-nudge-48h, NOT 48h-unfilled-nudge: Supabase requires
# ^[A-Za-z][A-Za-z0-9_-]*$, so a leading digit is rejected at deploy time.
[functions.unfilled-nudge-48h]
enabled = true
verify_jwt = false
entrypoint = "./functions/unfilled-nudge-48h/index.ts"

[functions.friend-expiry-alerts]
enabled = true
verify_jwt = false
entrypoint = "./functions/friend-expiry-alerts/index.ts"

[functions.nudge-unresponded-claims]
enabled = true
verify_jwt = false
entrypoint = "./functions/nudge-unresponded-claims/index.ts"
