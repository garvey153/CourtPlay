<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- favicon.ico is a real static file so /favicon.ico serves an image (not the
             SPA's index.html) — browsers and Chrome's address bar probe that path. -->
        <link rel="icon" href="/favicon.ico?v=8" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-v2.png" />
        <!-- sRGB, like every other icon. A Display P3 tag was tried here to reach a
             more vibrant green on iPhone, but it changed the stored RGB by only ~6
             levels: if iOS didn't honour the profile the icon looked identical to the
             previous one, which made "did the icon update?" impossible to answer. The
             vibrancy now comes from the colour itself (#00EE78, red at zero), which
             renders the same everywhere and needs no profile support.

             Served from a distinct path rather than apple-touch-icon.png?v=N, since
             iOS ignores the query when caching home-screen icons. The original
             filename stays on disk (same bytes) because iOS also probes
             /apple-touch-icon.png directly, and unknown paths fall through to the
             SPA's index.html — an image URL answering with HTML. -->
        <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
        <!-- maximum-scale=1 stops iOS Safari auto-zooming the viewport when a form
             control below 16px takes focus. Our sm-size fields are 14px, and bumping
             them to 16px would break the sm type scale across buttons, tabs and labels.
             Trade-off: in the installed PWA this also disables pinch-to-zoom. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
        <meta name="description" content="CourtPlay — find a tennis sub in Westport in under 10 minutes." />
        <meta name="theme-color" content="#08180e" />

        <!-- Installed PWA (home-screen app) chrome. CourtPlay ships dark-only. -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="CourtPlay" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet" />

        <title>CourtPlay</title>
    </head>

    <body class="size-full bg-primary antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <script>
            // CourtPlay ships dark-only. Apply unconditionally to avoid FOUC.
            // (Light-mode tokens + theme toggle remain in the code, dormant.)
            document.documentElement.classList.add("dark-mode");
        </script>
    </body>
</html>
