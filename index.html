<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- favicon.ico is a real static file so /favicon.ico serves an image (not the
             SPA's index.html) — browsers and Chrome's address bar probe that path. -->
        <link rel="icon" href="/favicon.ico?v=8" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=8" />
        <!-- Tagged Display P3 (the other icons stay sRGB). iOS colour-manages, so an
             sRGB green renders well inside the phone's gamut and looks dull; the same
             RGB values tagged P3 reach a noticeably more vibrant green on device. -->
        <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8" />
        <!-- maximum-scale=1 stops iOS Safari auto-zooming the viewport when a form
             control below 16px takes focus. Our sm-size fields are 14px, and bumping
             them to 16px would break the sm type scale across buttons, tabs and labels.
             Trade-off: in the installed PWA this also disables pinch-to-zoom. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
        <meta name="description" content="CourtPlay — find a tennis sub in Westport in under 10 minutes." />
        <meta name="theme-color" content="#08180e" />

        <!-- Installed PWA (home-screen app) chrome. CourtPlay ships dark-only. -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="CourtPlay" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet" />

        <title>CourtPlay</title>
    </head>

    <body class="size-full bg-primary antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <script>
            // CourtPlay ships dark-only. Apply unconditionally to avoid FOUC.
            // (Light-mode tokens + theme toggle remain in the code, dormant.)
            document.documentElement.classList.add("dark-mode");
        </script>
    </body>
</html>
